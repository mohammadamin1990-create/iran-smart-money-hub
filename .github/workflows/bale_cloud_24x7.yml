name: Iran Smart Money 24x7 Bale Cloud Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */5 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: iran-bale-cloud-singleton
  cancel-in-progress: true

jobs:
  bale-cloud-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 2-Way Bale AI Agent + 30-Min Signal Engine (5.5h Shift with Auto-Relay)
        env:
          CLOUD_MODE: "1"
          TZ: "Asia/Tehran"
          MAX_RUN_SECONDS: "19800"
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          STATE_DATASET_REPO: ${{ secrets.STATE_DATASET_REPO }}
          CAPITAL_TOMAN: ${{ secrets.CAPITAL_TOMAN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python cloud_hub/server.py
